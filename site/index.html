    <style>
      /* État de chargement : évite une page blanche si le JS est lent ou bloqué. */
      #root:empty {
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(70% 60% at 50% 0%, #0c2a22, #04130f 70%);
        color: #fbf8f2;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      #root:empty::before {
        content: 'BK';
        width: 64px;
        height: 64px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        font-family: Georgia, serif;
        font-size: 22px;
        color: #f0d9a7;
        background: linear-gradient(150deg, #16926c, #04130f);
        box-shadow: 0 20px 40px -18px rgba(0, 0, 0, 0.8);
      }
      #root:empty::after {
        content: 'Institut Bernard Kouchner — chargement de la page…';
        font-size: 14px;
        letter-spacing: 0.02em;
        color: rgba(251, 248, 242, 0.62);
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
