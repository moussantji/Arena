# CI — Kalanso
# Vérifie à chaque push/PR : les tests de l'API Laravel, le build de
# l'interface React et la construction (sans publication) du paquet
# desktop Linux. Aucune mise en ligne : rien n'est déployé ni publié.
name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    name: API — tests Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, sqlite3, pdo_sqlite, mysql, pdo_mysql, zip, intl, bcmath, gd, exif
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Tests (SQLite en mémoire)
        run: php artisan test

  app:
    name: Interface — build React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        run: npm run build

  desktop:
    name: Desktop — paquet Linux (sans publication)
    runs-on: ubuntu-latest
    needs: [api, app]
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            gallery/electron/package-lock.json

      - name: Cache des binaires Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('gallery/electron/package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Vérifier la syntaxe du processus principal
        run: |
          node --check gallery/electron/main.js
          node --check gallery/electron/preload.js

      - name: Build de l'interface
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Installer les dépendances desktop
        working-directory: gallery/electron
        run: npm ci

      - name: Construire le paquet (aucun envoi)
        working-directory: gallery/electron
        run: npx electron-builder --linux dir --publish never
