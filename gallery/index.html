<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#070B1F" />
<title>DIALLO — École premium · Electron</title>
<meta name="description" content="Application desktop Electron de gestion d'école — direction Indigo Minuit. Toutes les pages, cliquables et animées." />
<style>
  :root{
    /* Indigo Minuit */
    --bg:#070B1F;
    --bg2:#0B1030;
    --panel:rgba(27,42,107,.28);
    --panel-2:rgba(27,42,107,.42);
    --glass-hi:rgba(167,182,255,.10);
    --ink:#F0F2FF;
    --dim:#A7B6FF;
    --faint:#6B78A8;
    --line:rgba(167,182,255,.15);
    --line-strong:rgba(167,182,255,.28);
    --accent:#5B7CFA;
    --accent-2:#7E9BFF;
    --copper:#E0A86F;
    --glow:rgba(91,124,250,.42);
    --shadow:0 40px 90px -40px rgba(0,0,0,.85);

    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --ease:cubic-bezier(.22,.8,.22,1);
    --sidebar:236px;
    --topbar:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(900px 520px at 78% -8%, rgba(91,124,250,.20), transparent 62%),
      radial-gradient(700px 420px at 8% 104%, rgba(224,168,111,.09), transparent 64%),
      var(--bg);
    color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  ::selection{background:var(--accent);color:#fff}
  button{font:inherit}
  .mono{font-family:var(--mono)}
  .caps{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase}

  /* ================= shell ================= */
  .shell{
    height:100dvh;display:grid;
    grid-template-columns:var(--sidebar) 1fr;
    grid-template-rows:var(--topbar) 1fr;
    grid-template-areas:"title title" "side main";
  }

  /* titlebar */
  .titlebar{
    grid-area:title;display:flex;align-items:center;gap:14px;padding:0 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(27,42,107,.35), rgba(7,11,31,.55));
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    -webkit-app-region:drag;user-select:none;z-index:30;
  }
  .lights{display:flex;gap:8px;flex:none;-webkit-app-region:no-drag}
  .lights button{
    width:12px;height:12px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);transition:transform .2s var(--ease),filter .2s;
  }
  .lights button::after{
    content:"";position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity .2s;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.55) 0 1px, transparent 1.2px);
  }
  .lights .l1{background:#E4655B}.lights .l2{background:#DFB44A}.lights .l3{background:#5FAF62}
  .lights:hover button{transform:scale(1.06)}
  .lights button:active{transform:scale(.94)}
  .win-title{
    flex:1;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .win-title b{color:var(--dim);font-weight:500}
  .titlebar-right{display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag}
  .pill-ghost{
    display:flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;
    border:1px solid var(--line);background:var(--glass-hi);color:var(--dim);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.2s;
  }
  .pill-ghost:hover{color:var(--ink);border-color:var(--line-strong);background:var(--panel-2)}
  .pill-ghost.on{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 0 18px -4px var(--glow)}
  .pill-ghost svg{width:12px;height:12px}
a.pill-ghost{text-decoration:none}

  /* sidebar */
  .sidebar{
    grid-area:side;display:flex;flex-direction:column;gap:10px;padding:16px 12px 14px;
    border-right:1px solid var(--line);
    background:linear-gradient(180deg, rgba(27,42,107,.22), rgba(7,11,31,.35));
    position:relative;z-index:20;min-height:0;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px}
  .mark{
    width:30px;height:30px;border-radius:9px;flex:none;position:relative;
    background:linear-gradient(150deg,var(--accent-2),var(--accent));
    box-shadow:0 0 0 1px rgba(255,255,255,.14),0 10px 24px -12px var(--glow);
  }
  .mark::after{
    content:"";position:absolute;inset:7px 8px;border-radius:3px;background:var(--bg);
    clip-path:polygon(0 0,62% 0,100% 42%,38% 100%,0 100%);
  }
  .brand b{display:block;font-size:14px;letter-spacing:.04em;font-weight:700}
  .brand span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:2px}

  .nav{position:relative;display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
  .nav::-webkit-scrollbar{width:6px}
  .nav::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px}
  .nav-sep{height:1px;background:var(--line);margin:9px 10px}
  .nav-label{padding:8px 12px 4px;color:var(--faint);font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase}

  .indicator{
    position:absolute;left:0;width:100%;height:38px;border-radius:11px;pointer-events:none;
    background:linear-gradient(90deg, rgba(91,124,250,.30), rgba(91,124,250,.10));
    border:1px solid rgba(91,124,250,.42);
    box-shadow:0 0 26px -8px var(--glow), inset 0 0 0 1px rgba(255,255,255,.04);
    transition:transform .42s var(--ease), opacity .25s ease, height .3s var(--ease);
    opacity:0;
  }
  .indicator::before{
    content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:2px;border-radius:2px;
    background:var(--accent);box-shadow:0 0 12px 1px var(--glow);
  }

  .nav-item{
    position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 11px;
    border-radius:11px;border:1px solid transparent;background:transparent;color:var(--dim);
    font-size:13px;text-align:left;cursor:pointer;width:100%;
    transition:color .22s, background .22s, transform .18s var(--ease);
    -webkit-app-region:no-drag;
  }
  .nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85;transition:opacity .2s,transform .3s var(--ease)}
  .nav-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-item .kb{
    margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--faint);
    border:1px solid var(--line);border-radius:4px;padding:1px 4px;opacity:0;transition:opacity .2s;
  }
  .nav-item:hover{color:var(--ink);background:rgba(167,182,255,.06)}
  .nav-item:hover .kb{opacity:1}
  .nav-item:hover svg{opacity:1;transform:scale(1.06)}
  .nav-item.active{color:#fff}
  .nav-item.active svg{opacity:1;stroke:var(--accent-2)}
  .nav-item[disabled]{opacity:.42;cursor:not-allowed}
  .nav-item .soon{
    margin-left:auto;font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--copper);border:1px solid rgba(224,168,111,.35);border-radius:4px;padding:1px 5px;background:rgba(224,168,111,.08);
  }

  .user{
    margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;
    border:1px solid var(--line);background:var(--glass-hi);transition:.22s;cursor:pointer;
  }
  .user:hover{border-color:var(--line-strong);background:var(--panel-2)}
  .avatar{width:30px;height:30px;border-radius:50%;flex:none;background:linear-gradient(150deg,#8FA6FF,#4A66D8);position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .avatar::after{content:"MD";position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;color:#0B1030;letter-spacing:.02em}
  .user b{display:block;font-size:11.5px;font-weight:600}
  .user span{display:block;font-family:var(--mono);font-size:8.5px;color:var(--faint);margin-top:2px;letter-spacing:.06em}

  /* main */
  .main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}

  .topbar{
    display:flex;align-items:center;gap:14px;padding:0 22px;height:52px;flex:none;
    border-bottom:1px solid var(--line);position:relative;z-index:15;
  }
  .crumbs{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);min-width:0}
  .crumbs .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
  .crumbs .c.cur{color:var(--dim)}
  .crumbs .sep{opacity:.5}

  .search{position:relative;margin-left:auto;width:min(300px,34vw)}
  .search input{
    width:100%;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(167,182,255,.06);
    color:var(--ink);padding:0 12px 0 34px;font-size:12.5px;outline:none;transition:.22s;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{border-color:var(--accent);background:rgba(91,124,250,.12);box-shadow:0 0 0 4px rgba(91,124,250,.14)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:1.8;pointer-events:none}
  .search kbd{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:8.5px;
    color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 4px;
  }
  .icon-btn{
    width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--glass-hi);
    display:grid;place-items:center;cursor:pointer;color:var(--dim);transition:.2s;position:relative;
  }
  .icon-btn:hover{color:#fff;border-color:var(--line-strong);background:var(--panel-2)}
  .icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .dot-badge{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--copper);box-shadow:0 0 8px var(--copper)}
  .topbar .avatar{width:32px;height:32px;cursor:pointer}

  /* command palette */
  .palette{
    position:absolute;top:46px;right:22px;width:340px;z-index:60;border-radius:14px;overflow:hidden;
    border:1px solid var(--line-strong);background:rgba(11,16,48,.96);backdrop-filter:blur(20px);
    box-shadow:var(--shadow);opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:.24s var(--ease);
  }
  .palette.open{opacity:1;transform:none;pointer-events:auto}
  .palette .pl{max-height:320px;overflow:auto;padding:6px}
  .palette .ph{padding:10px 12px 8px;color:var(--faint);font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--line)}
  .palette .pi{
    display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;border:0;background:transparent;
    color:var(--dim);font-size:12.5px;text-align:left;cursor:pointer;transition:.16s;
  }
  .palette .pi svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
  .palette .pi.sel{background:rgba(91,124,250,.2);color:#fff}
  .palette .pi em{margin-left:auto;font-family:var(--mono);font-size:8.5px;font-style:normal;color:var(--faint)}
  .palette .empty{padding:18px 12px;color:var(--faint);font-size:12px;text-align:center}

  /* page */
  .page{flex:1;min-height:0;display:flex;flex-direction:column;padding:18px 22px 14px;gap:14px;position:relative;z-index:5}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;flex:none}
  .page-head .ttl{min-width:0}
  .page-head h1{
    margin:0;font-size:clamp(21px,2.1vw,29px);line-height:1.08;letter-spacing:-.02em;font-weight:700;
    display:flex;align-items:center;gap:10px;
  }
  .page-head h1 .fade-swap{display:inline-block}
  .page-head p{margin:5px 0 0;color:var(--dim);font-size:12.5px;opacity:.9}
  .head-actions{display:flex;gap:8px;align-items:center;flex:none}
  .btn{
    display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 15px;border-radius:9px;cursor:pointer;
    font-size:12px;letter-spacing:.01em;border:1px solid var(--line-strong);background:var(--glass-hi);color:var(--ink);
    transition:transform .18s var(--ease),background .2s,border-color .2s,box-shadow .2s;
  }
  .btn:hover{background:var(--panel-2);border-color:var(--line-strong);transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn.solid{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:rgba(255,255,255,.18);color:#fff;font-weight:600;box-shadow:0 10px 26px -12px var(--glow)}
  .btn.solid:hover{box-shadow:0 16px 34px -12px var(--glow);filter:brightness(1.05)}
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* stage */
  .stage{
    position:relative;flex:1;min-height:0;display:grid;place-items:center;perspective:1600px;
  }
  .frame{
    position:relative;width:100%;height:100%;max-height:100%;border-radius:16px;overflow:hidden;
    border:1px solid var(--line-strong);background:#05081A;
    box-shadow:0 50px 110px -50px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.04);
    transform-style:preserve-3d;
    transition:transform .5s var(--ease),border-color .4s,box-shadow .4s;
    cursor:zoom-in;
  }
  .frame:hover{border-color:rgba(91,124,250,.45);box-shadow:0 60px 120px -50px rgba(0,0,0,.95),0 0 60px -22px var(--glow),inset 0 0 0 1px rgba(255,255,255,.06)}
  .frame .slide{position:absolute;inset:0;will-change:transform,opacity}
  .frame .slide img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;
    background:#05081A;
  }
  .frame .slide.in{animation:slideIn .62s var(--ease) both}
  .frame .slide.out{animation:slideOut .42s var(--ease) both}
  .frame .slide.in img{animation:kenburns 12s ease-out both}
  @keyframes slideIn{
    from{opacity:0;transform:translate3d(var(--dx,26px),0,0) scale(.985)}
    to{opacity:1;transform:none}
  }
  @keyframes slideOut{
    from{opacity:1;transform:none}
    to{opacity:0;transform:translate3d(calc(var(--dx,26px) * -1),0,0) scale(.99)}
  }
  @keyframes kenburns{from{transform:scale(1.012)}to{transform:scale(1)}}

  .frame .chrome{
    position:absolute;left:12px;bottom:12px;z-index:6;display:flex;align-items:center;gap:8px;
    padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);
    background:rgba(5,8,26,.62);backdrop-filter:blur(10px);
    font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,242,255,.82);
    pointer-events:none;
  }
  .frame .chrome i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .frame .zoom-hint{
    position:absolute;right:12px;bottom:12px;z-index:6;display:flex;align-items:center;gap:7px;
    padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.16);
    background:rgba(5,8,26,.55);backdrop-filter:blur(10px);
    font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,242,255,.85);
    opacity:0;transform:translateY(6px);transition:.26s var(--ease);
  }
  .frame:hover .zoom-hint{opacity:1;transform:none}

  /* skeleton */
  .skeleton{position:absolute;inset:0;z-index:4;background:linear-gradient(100deg,rgba(27,42,107,.2) 30%,rgba(91,124,250,.14) 50%,rgba(27,42,107,.2) 70%);
    background-size:280% 100%;animation:shimmer 1.2s linear infinite}
  @keyframes shimmer{from{background-position:140% 0}to{background-position:-40% 0}}
  .skeleton.hide{opacity:0;pointer-events:none;transition:opacity .4s}
  .skeleton .bar{position:absolute;border-radius:8px;background:rgba(167,182,255,.08)}
  .skeleton .bar.a{left:4%;top:6%;width:22%;height:6%}
  .skeleton .bar.b{left:4%;top:16%;width:44%;height:5%}
  .skeleton .bar.c{left:4%;top:30%;width:92%;height:20%}
  .skeleton .bar.d{left:4%;top:54%;width:60%;height:14%}
  .skeleton .bar.e{left:68%;top:54%;width:28%;height:38%}
  .skeleton .bar.f{left:4%;top:72%;width:60%;height:20%}

  /* dock */
  .dock{
    position:absolute;left:50%;bottom:-6px;transform:translate(-50%,0);z-index:12;
    display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
    border:1px solid var(--line-strong);background:rgba(11,16,48,.78);backdrop-filter:blur(16px);
    box-shadow:0 22px 50px -24px rgba(0,0,0,.9);
    transition:transform .3s var(--ease),opacity .3s;
  }
  .dock:hover{transform:translate(-50%,-4px)}
  .dock .dbtn{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    border:1px solid transparent;background:transparent;color:var(--dim);transition:.18s;
  }
  .dock .dbtn:hover{background:var(--panel-2);color:#fff;border-color:var(--line)}
  .dock .dbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .dock .count{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint);
    padding:0 8px;white-space:nowrap;
  }
  .dock .count b{color:var(--ink);font-weight:500}
  .dock .progress{width:52px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-right:6px}
  .dock .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px;transition:width .45s var(--ease)}

  /* zoom overlay */
  .zoom{
    position:fixed;inset:0;z-index:90;display:none;background:rgba(4,6,18,.94);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    align-items:center;justify-content:center;padding:3vmin;
  }
  .zoom.open{display:flex}
  .zoom img{
    max-width:96vw;max-height:92vh;width:auto;border-radius:12px;border:1px solid rgba(255,255,255,.16);
    box-shadow:0 60px 140px -50px #000;
    animation:zoomIn .42s var(--ease) both;transform-origin:center;
  }
  @keyframes zoomIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .zoom .zclose{
    position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;
    display:grid;place-items:center;font-size:15px;transition:.2s;
  }
  .zoom .zclose:hover{background:#fff;color:#070B1F}
  .zoom .zcap{
    position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(240,242,255,.6);
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  }

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);z-index:95;
    background:var(--ink);color:#070B1F;padding:9px 16px;border-radius:999px;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    opacity:0;pointer-events:none;transition:.28s var(--ease);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* boot loader */
  .boot{
    position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);
    transition:opacity .5s ease,visibility .5s;
  }
  .boot.gone{opacity:0;visibility:hidden}
  .boot .bwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
  .boot .bmark{width:44px;height:44px;border-radius:13px;background:linear-gradient(150deg,var(--accent-2),var(--accent));
    position:relative;box-shadow:0 0 40px -6px var(--glow);animation:bootpulse 1.6s ease-in-out infinite}
  .boot .bmark::after{content:"";position:absolute;inset:10px 11px;border-radius:4px;background:var(--bg);clip-path:polygon(0 0,62% 0,100% 42%,38% 100%,0 100%)}
  @keyframes bootpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.9}}
  .boot .bt{font-family:var(--mono);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}

/* ================= data ================= */

};

const PAGES = [
  { id:'dashboard', label:'Tableau de bord', icon:'home', group:'Pilotage',
    title:'Tableau de bord', sub:'Lundi 27 octobre · 42 classes actives',

  { id:'classes', label:'Classes', icon:'classes', group:'Pilotage',

  { id:'personnel', label:'Personnel', icon:'staff', group:'Gestion',
    title:'Personnel', sub:'68 membres · 42 enseignants',
    crumb:['Personnel','Enseignants'], primary:'Ajouter un membre', secondary:'Annuaire',
    img:'palettes/indigo-page-personnel.png' },

  { id:'messagerie', label:'Messagerie', icon:'messages', group:'Gestion',
    title:'Messagerie', sub:'4 conversations · 2 non lus',
    crumb:['Messagerie','Boîte de réception'], primary:'Nouveau message', secondary:'Tout marquer lu',
    img:'palettes/indigo-page-messagerie.png' },

  { id:'notes', label:'Notes', icon:'grades', group:'Pédagogie',
    title:'Notes', sub:'Terminale S · Trimestre 1 · 32 élèves',
    crumb:['Élèves','Notes · Trimestre 1'], primary:'Saisir les notes', secondary:'Bulletins',
    img:'palettes/indigo-page-notes.png' },

  { id:'absences', label:'Absences', icon:'absences', group:'Pédagogie',
    title:'Absences', sub:'Octobre 2026 · 96,8 % de présence',
    crumb:['Élèves','Absences · Octobre'], primary:'Justifier une absence', secondary:'Exporter',
    img:'palettes/indigo-page-absences.png' },

  { id:'admissions', label:'Admissions', icon:'admissions', group:'Pédagogie',
    title:'Admissions', sub:'Rentrée 2026 · 128 dossiers en cours',
    crumb:['Admissions','Rentrée 2026'], primary:'Nouveau dossier', secondary:'Exporter',
    img:'palettes/indigo-page-admissions.png' },

  { id:'fiche', label:'Fiche élève', icon:'profile', group:'Pédagogie',
    title:'Aminata Traoré', sub:'Terminale S · Matricule 2026-0142',
    crumb:['Élèves','Fiche élève'], primary:'Modifier', secondary:'Message',
    img:'palettes/indigo-page-profil.png' },

  { id:'parametres', label:'Paramètres', icon:'settings', group:'Système',
    title:'Paramètres', sub:'Établissement · Compte · Notifications',
    crumb:['Paramètres','Établissement'], primary:'Enregistrer', secondary:'Réinitialiser',
    img:'palettes/indigo-page-parametres.png' }
];

const SOON = [
  { label:'Admissions', icon:'admissions' },
  { label:'Fiche élève', icon:'profile' }
];

/* ================= state ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad2 = (n) => String(n).padStart(2, '0');
const reduced = typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)').matches : false;

/* Web Animations API — ignoré si indisponible (environnements de test) */
function anim(el, frames, opts){
  if (!el || typeof el.animate !== 'function' || reduced) return null;
  try { return el.animate(frames, opts); } catch (e) { return null; }
}

let index = 0;
let busy = false;
let tourTimer = null;
let tourOn = false;
let palSel = 0;
const loaded = new Set();
const preloaded = new Map();

/* ================= build nav ================= */
function buildNav(){
  const nav = $('#nav');
  let html = '';
  let group = null;
  PAGES.forEach((p, i) => {
    if (p.group !== group){
      group = p.group;
      html += `<div class="nav-label">${p.group}</div>`;
    }
    html += `
      <button class="nav-item" data-i="${i}" type="button">
        <svg viewBox="0 0 24 24">${ICONS[p.icon]}</svg>
        <span>${p.label}</span>
        <em class="kb">${i + 1 <= 9 ? i + 1 : 0}</em>
      </button>`;
  });
  html += `<div class="nav-sep"></div>`;
  SOON.forEach(s => {
    html += `
      <button class="nav-item" type="button" disabled title="Bientôt">
        <svg viewBox="0 0 24 24">${ICONS[s.icon]}</svg>
        <span>${s.label}</span>
        <em class="soon">Bientôt</em>
      </button>`;
  });
  nav.insertAdjacentHTML('beforeend', html);

  nav.addEventListener('click', (e) => {
    const b = e.target.closest('.nav-item[data-i]');
    if (b) go(Number(b.dataset.i));
  });
}

function buildPalette(){
  const list = $('#paletteList');
  const render = (q = '') => {
    const items = PAGES.filter(p => (p.label + ' ' + p.crumb.join(' ')).toLowerCase().includes(q.toLowerCase()));
    palSel = 0;
    list.innerHTML = items.length ? items.map((p, k) => `
      <button class="pi ${k === palSel ? 'sel' : ''}" data-id="${p.id}">
        <svg viewBox="0 0 24 24">${ICONS[p.icon]}</svg>
        <span>${p.label}</span>
        <em>${PAGES.indexOf(p) + 1 <= 9 ? PAGES.indexOf(p) + 1 : 0}</em>
      </button>`).join('') : `<div class="empty">Aucune page</div>`;
  };
  render();

  const input = $('#search');
  input.addEventListener('focus', () => { $('#palette').classList.add('open'); render(input.value); });
  input.addEventListener('input', () => { $('#palette').classList.add('open'); render(input.value); });

  list.addEventListener('click', (e) => {
    const b = e.target.closest('.pi');
    if (!b) return;
    const i = PAGES.findIndex(p => p.id === b.dataset.id);
    if (i >= 0) { go(i); closePalette(); }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search') && !e.target.closest('.palette')) closePalette();
  });
  $('#palette')._render = render;
}
function closePalette(){
  $('#palette').classList.remove('open');
  $('#search').blur();
  $('#search').value = '';
}

/* ================= indicator ================= */
function moveIndicator(){
  const ind = $('#indicator');
  const active = $('.nav-item.active');
  if (!active){ ind.style.opacity = 0; return; }
  const nav = $('#nav');
  const nr = nav.getBoundingClientRect();
  const ar = active.getBoundingClientRect();
  ind.style.opacity = 1;
  ind.style.height = ar.height + 'px';
  ind.style.transform = `translateY(${ar.top - nr.top + nav.scrollTop}px)`;
}

/* ================= navigation ================= */
function go(next, opts = {}){
  next = (next + PAGES.length) % PAGES.length;
  if (next === index && !opts.force) return;
  const dir = opts.dir != null ? opts.dir : (next > index ? 1 : -1);
  const prev = PAGES[index];
  index = next;
  const p = PAGES[index];

  /* texts */
  $('#winPage').textContent = p.title;
  $('#crumbRoot').textContent = p.crumb[0];
  $('#crumbSub').textContent = p.crumb[1];
  $('#pageTitle').textContent = p.title;
  $('#pageSub').textContent = p.sub;
  $('#btnPrimaryLabel').textContent = p.primary;
  $('#btnSecondaryLabel').textContent = p.secondary;
  $('#dockIndex').textContent = pad2(index + 1);
  $('#progress').style.width = ((index + 1) / PAGES.length * 100).toFixed(1) + '%';
  $('#chromeLabel').textContent = `Page ${pad2(index + 1)} / ${PAGES.length}`;
  document.title = `${p.title} — DIALLO · Electron`;

  /* title micro-animation */
  anim($('#pageTitle'),
    [{ opacity: .35, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }],
    { duration: 380, easing: 'cubic-bezier(.22,.8,.22,1)' });
  anim($('#pageSub'),
    [{ opacity: 0, transform: 'translateY(4px)' }, { opacity: .9, transform: 'none' }],
    { duration: 460, delay: 60, easing: 'cubic-bezier(.22,.8,.22,1)' });

  /* nav state */
  $$('.nav-item').forEach((b, i) => b.classList.toggle('active', i === index));
  moveIndicator();
  $('#sidebar').classList.remove('open');

  /* slides */
  const inSlide = $('#slideA'), outSlide = $('#slideB');
  const showing = inSlide.style.display !== 'none' ? inSlide : outSlide;
  const incoming = inSlide.style.display === 'none' ? inSlide : outSlide;

  incoming.style.display = 'block';
  incoming.style.setProperty('--dx', dir > 0 ? '30px' : '-30px');
  incoming.classList.remove('out'); incoming.classList.remove('in');
  incoming.innerHTML = `<img src="${p.img}" alt="${p.title} — capture de l'application" draggable="false">`;

  const sk = $('#skeleton');
  if (!loaded.has(p.img)){
    sk.classList.remove('hide');
  } else {
    sk.classList.add('hide');
  }

  const img = incoming.querySelector('img');
  const finish = () => {
    loaded.add(p.img);
    sk.classList.add('hide');
  };
  if (img.complete) finish(); else img.addEventListener('load', finish, { once: true });

  /* animate in/out */
  incoming.classList.add('in');
  if (showing && showing !== incoming){
    showing.classList.remove('in');
    showing.style.setProperty('--dx', dir > 0 ? '30px' : '-30px');
    showing.classList.add('out');
    setTimeout(() => { showing.style.display = 'none'; showing.classList.remove('out'); }, reduced ? 1 : 420);
  }
  incoming.addEventListener('animationend', () => incoming.classList.remove('in'), { once: true });
  setTimeout(() => incoming.classList.remove('in'), reduced ? 1 : 700);

  /* frame accent flash */
  if (!reduced){
    anim($('#frame'),
      [{ boxShadow: '0 0 0 1px rgba(91,124,250,0) inset, 0 50px 110px -50px rgba(0,0,0,.9)' },
       { boxShadow: '0 0 0 1px rgba(91,124,250,.5) inset, 0 0 70px -18px rgba(91,124,250,.5), 0 50px 110px -50px rgba(0,0,0,.9)' },
       { boxShadow: '0 0 0 1px rgba(91,124,250,0) inset, 0 50px 110px -50px rgba(0,0,0,.9)' }],
      { duration: 900, easing: 'ease-out' });
  }

  history.replaceState(null, '', '#' + p.id);

  /* preload neighbours */
  [index + 1, index + 2, index - 1].forEach(k => {
    const q = PAGES[(k + PAGES.length) % PAGES.length];
    if (!preloaded.has(q.img)){
      const im = new Image();
      im.src = q.img;
      preloaded.set(q.img, im);
    }
  });
}

/* ================= zoom ================= */
function openZoom(){
  const p = PAGES[index];
  const z = $('#zoom');
  $('#zoomImg').src = p.img;
  $('#zoomImg').alt = p.title + ' — plein écran';
  $('#zoomCap').textContent = p.title + ' · ' + p.sub;
  z.classList.add('open');
}
function closeZoom(){ $('#zoom').classList.remove('open'); }

/* ================= toast ================= */
let toastT;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 1600);
}

/* ================= tour ================= */
function toggleTour(){
  tourOn = !tourOn;
  $('#tourBtn').classList.toggle('on', tourOn);
  $('#tourLabel').textContent = tourOn ? 'Pause' : 'Visite';
  clearInterval(tourTimer);
  if (tourOn){
    go((index + 1) % PAGES.length);
    tourTimer = setInterval(() => go((index + 1) % PAGES.length), 3600);
    toast('Visite animée · ' + PAGES.length + ' pages');
  } else {
    toast('Visite en pause');
  }
}

/* ================= frame tilt ================= */
function bindTilt(){
  const stage = $('#stage'), frame = $('#frame');
  let raf = null;
  stage.addEventListener('pointermove', (e) => {
    if (reduced) return;
    const r = stage.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - .5;
    const py = (e.clientY - r.top) / r.height - .5;
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      frame.style.transform = `rotateX(${(-py * 1.6).toFixed(2)}deg) rotateY(${(px * 2).toFixed(2)}deg) translateZ(0)`;
    });
  });
  stage.addEventListener('pointerleave', () => {
    frame.style.transform = '';
  });
}

/* ================= window controls ================= */
function bindWindowControls(){
  $$('.lights button').forEach(b => {
    b.addEventListener('click', async () => {
      const act = b.dataset.win;
      const api = window.desktopAPI;
      if (!api){ toast('Contrôles de fenêtre · disponibles dans Electron'); return; }
      if (act === 'min') api.minimize();
      if (act === 'max') api.toggleMaximize();
      if (act === 'close') api.close();
    });
  });
}

/* ================= boot ================= */
function boot(){
  buildNav();
  buildPalette();
  bindTilt();
  bindWindowControls();

  $('#prevBtn').addEventListener('click', () => go(index - 1));
  $('#nextBtn').addEventListener('click', () => go(index + 1));
  $('#frame').addEventListener('click', openZoom);
  $('#zoomClose').addEventListener('click', closeZoom);
  $('#zoom').addEventListener('click', (e) => { if (e.target === $('#zoom')) closeZoom(); });
  $('#tourBtn').addEventListener('click', toggleTour);
  $('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $('#themeBtn').addEventListener('click', () => toast('Direction : Indigo Minuit'));
  $('#btnPrimary').addEventListener('click', () => toast(PAGES[index].primary));
  $('#btnSecondary').addEventListener('click', () => toast(PAGES[index].secondary));

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT'){
      const list = $$('#paletteList .pi');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        e.preventDefault();
        if (!list.length) return;
        palSel = (palSel + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
        list.forEach((el, k) => el.classList.toggle('sel', k === palSel));
        list[palSel].scrollIntoView({ block:'nearest' });
      }
      if (e.key === 'Enter' && list[palSel]) list[palSel].click();
      if (e.key === 'Escape') closePalette();
      return;
    }

    if (e.key === 'Escape'){ closeZoom(); closePalette(); }
    if (e.key === 'ArrowRight') go(index + 1);
    if (e.key === 'ArrowLeft') go(index - 1);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#search').focus(); }
    if (e.key === 'f' || e.key === 'F'){ openZoom(); }
    if (e.key === 't' || e.key === 'T'){ toggleTour(); }
    if (/^[1-9]$/.test(e.key)) go(Number(e.key) - 1);
    if (e.key === '0') go(9);
  });

  const hash = location.hash.replace('#','');
  const start = PAGES.findIndex(p => p.id === hash);
  go(start >= 0 ? start : 0, { force:true });

  requestAnimationFrame(moveIndicator);
  window.addEventListener('resize', moveIndicator);
  $('#nav').addEventListener('scroll', moveIndicator);

  setTimeout(() => $('#boot').classList.add('gone'), 620);
}

boot();
</script>
